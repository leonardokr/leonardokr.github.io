name: 🚀 Deploy Portfolio

on:
  push:
    branches: [ source ]
  pull_request:
    branches: [ source ]

jobs:
  # Quality and testing job
  quality-check:
    name: 🔍 Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Run ESLint
        run: yarn lint || echo "Lint warnings found"

      - name: Check Build
        run: yarn build

  # Automated deployment job
  deploy:
    name: 🚀 Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: quality-check
    if: github.ref == 'refs/heads/source' && github.event_name == 'push'
    
    # Required permissions for GitHub Pages
    permissions:
      contents: read
      pages: write
      id-token: write

    # Production environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Build Portfolio
        run: yarn build

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v2
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v2

  # Notification job (optional)
  notify:
    name: 📢 Notify Success
    runs-on: ubuntu-latest
    needs: deploy
    if: success()
    steps:
      - name: Success Notification
        run: |
          echo "🎉 Portfolio deployed successfully!"
          echo "🌐 URL: https://leonardokr.github.io/"
          echo "📅 Deployed at: $(date)"
